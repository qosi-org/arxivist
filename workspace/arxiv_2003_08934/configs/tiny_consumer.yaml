# =============================================================================
# tiny_consumer.yaml — Consumer-hardware preset inspired by the official
# TinyNeRF demo notebook (bmild/nerf: tiny_nerf.ipynb). Targets ~4GB VRAM
# GPUs (e.g. a laptop RTX 3050) and fast iteration over paper fidelity.
#
# IMPORTANT (SIR implementation_assumptions[3], confidence 0.5): TinyNeRF is
# an external community/author demo, NOT part of the peer-reviewed paper
# methodology. Its exact published hyperparameters could not be verified from
# the paper text alone; the values below are the well-known defaults from
# that public notebook, applied here as a clearly-separated, opt-in preset.
# Use via: python train.py --config configs/tiny_consumer.yaml --tiny
# (--tiny additionally triggers utils/tiny_variant.py::TinyNeRFPreset)
# =============================================================================

model:
  pos_enc_freqs_x: 6          # ASSUMED (TinyNeRF notebook default, lower than paper's L=10)
  pos_enc_freqs_d: 4
  include_input_in_encoding: false
  trunk_depth: 8               # NOTE: --tiny flag further shrinks this at runtime, see TinyNeRFPreset
  trunk_width: 128             # ASSUMED (TinyNeRF notebook default, half the paper's 256)
  skip_layers: [4]
  color_hidden_width: 64
  use_view_dependence: true
  num_coarse_samples: 64
  num_fine_samples: 0          # TinyNeRF uses a SINGLE network / single sampling pass, no hierarchical fine net
  use_hierarchical_sampling: false
  perturb_stratified: true
  raw_noise_std: 0.0

model_variant:
  name: "no_hierarchical_sampling"   # TinyNeRF corresponds most closely to this SIR ablation variant

training:
  optimizer: "adam"
  learning_rate_init: 0.0005
  learning_rate_final: 0.00005
  lr_schedule: "exponential_decay"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-7
  ray_batch_size: 1024          # ASSUMED (TinyNeRF notebook default, well below the paper's 4096)
  num_training_steps: 5000      # ASSUMED (TinyNeRF notebook default; paper's full model needs 100k-300k)
  checkpoint_every: 500
  log_every: 25
  eval_every: 500
  seed: 0
  deterministic: false

data:
  dataset_type: "blender"
  datadir: null
  half_res: true                 # renders at reduced resolution (~100x100, TinyNeRF style) via TinyNeRFPreset
  testskip: 1
  white_background: true
  near: 2.0
  far: 6.0
  use_ndc: false

evaluation:
  metrics: ["psnr"]              # SSIM/LPIPS skipped by default for speed; can be re-enabled
  chunk_size: 4096
  render_test_every: 1000
  save_rendered_images: true

hardware:
  device: "gpu"                  # falls back gracefully to cpu if no GPU is visible
  mixed_precision: false
  num_workers: 2
  tiny_hardware_mode: true
