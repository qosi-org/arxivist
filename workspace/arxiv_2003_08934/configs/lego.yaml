# =============================================================================
# lego.yaml — Example per-scene config for the "Lego" Realistic Synthetic 360
# scene (Table 1 / Table 4 per-scene column "Lego"). This is the config used
# by docker/Dockerfile's default CMD. Derived from configs/config.yaml (base
# paper-faithful defaults) with the dataset fields pinned to the Lego scene.
# =============================================================================

model:
  pos_enc_freqs_x: 10
  pos_enc_freqs_d: 4
  include_input_in_encoding: false
  trunk_depth: 8
  trunk_width: 256
  skip_layers: [4]
  color_hidden_width: 128
  use_view_dependence: true
  num_coarse_samples: 64
  num_fine_samples: 128
  use_hierarchical_sampling: true
  perturb_stratified: true
  raw_noise_std: 0.0

model_variant:
  name: "full"

training:
  optimizer: "adam"
  learning_rate_init: 0.0005
  learning_rate_final: 0.00005
  lr_schedule: "exponential_decay"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-7
  ray_batch_size: 4096
  num_training_steps: 250000   # ASSUMED, see configs/config.yaml
  checkpoint_every: 10000
  log_every: 100
  eval_every: 25000
  seed: 0
  deterministic: false

data:
  dataset_type: "blender"
  datadir: "/data/lego"        # overridden by --datadir at the CLI; matches Docker default mount point
  half_res: false               # false to match Table 1's 800x800 Lego numbers (PSNR 32.54, Table 4)
  testskip: 8
  white_background: true
  near: 2.0
  far: 6.0
  use_ndc: false

evaluation:
  metrics: ["psnr", "ssim", "lpips"]
  chunk_size: 8192
  render_test_every: 50000
  save_rendered_images: true

hardware:
  device: "gpu"
  mixed_precision: false
  num_workers: 4
  tiny_hardware_mode: false
