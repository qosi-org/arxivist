# =============================================================================
# config.yaml — Base (paper-faithful) hyperparameters for NeRF reproduction.
# Source: arXiv:2003.08934, Sections 3-6 + Appendix A-C.
# Generated by ArXivist Stage 4 from architecture_plan.json / sir.json.
#
# Any value marked "# ASSUMED: <basis>" was not explicitly pinned down by the
# paper text; see sir.json -> implementation_assumptions / ambiguities for the
# full justification and listed alternatives.
# =============================================================================

model:
  # --- Positional encoding (Sec 5.1, Eq. 4) --- SIR confidence 0.95
  pos_enc_freqs_x: 10          # L for gamma(x) -> encoded dim = 2*10*3 = 60
  pos_enc_freqs_d: 4           # L for gamma(d) -> encoded dim = 2*4*3  = 24
  include_input_in_encoding: false  # paper's gamma(p) formula (Eq.4) does not append raw p

  # --- MLP trunk (Sec 3, Fig. 7) --- SIR confidence 0.95
  trunk_depth: 8                # 8 fully-connected ReLU layers
  trunk_width: 256              # 256 channels per layer
  skip_layers: [4]              # 0-indexed: gamma(x) is re-concatenated into activation of layer 5 (index 4)
  color_hidden_width: 128       # width of the single ReLU layer in the color head
  use_view_dependence: true     # if false, reproduces the "No View Dependence" ablation (Table 2, row 3)

  # --- Hierarchical sampling (Sec 5.2) --- SIR confidence 0.9
  num_coarse_samples: 64        # Nc
  num_fine_samples: 128         # Nf (added on top of Nc for the fine pass -> 192 total)
  use_hierarchical_sampling: true   # if false, reproduces "No Hierarchical" ablation (single net, 256 uniform samples)
  perturb_stratified: true      # stratified sampling (Eq. 2) draws a random offset per bin; false = deterministic midpoints (eval mode)

  # --- Density regularization (Appendix A, "Training Details") --- SIR confidence 0.9
  raw_noise_std: 0.0            # ASSUMED: paper states Gaussian noise added to raw sigma only for REAL scene data.
                                 # Set to 1.0 for real (LLFF) scenes via configs/llff_scene.yaml override; 0.0 for synthetic.

model_variant:
  # Set which SIR-documented ablation variant to build. "full" = default paper model.
  name: "full"   # one of: full | no_positional_encoding | no_view_dependence | no_hierarchical_sampling

training:
  # --- Optimizer (Appendix A) --- SIR confidence 0.95
  optimizer: "adam"
  learning_rate_init: 0.0005    # 5e-4
  learning_rate_final: 0.00005  # 5e-5, reached via exponential decay over training
  lr_schedule: "exponential_decay"
  # ASSUMED (SIR ambiguity, confidence 0.6): exact decay formula is not stated by the paper beyond
  # "begins at 5e-4 and decays exponentially to 5e-5 over the course of optimization".
  # We use: lr(step) = lr_init * (lr_final/lr_init) ** (step / num_training_steps)
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-7

  ray_batch_size: 4096          # rays sampled per optimization step (Appendix A)

  # ASSUMED (SIR ambiguity, confidence 0.6): paper reports "100k-300k iterations" without a single
  # fixed number for headline results. We default to the midpoint.
  num_training_steps: 250000

  checkpoint_every: 10000
  log_every: 100
  eval_every: 25000

  seed: 0                       # global reproducibility seed (see utils/config.py:set_global_seed)
  deterministic: false          # true forces TF deterministic ops (slower); recommended for debugging only

data:
  dataset_type: "blender"       # one of: blender | llff | deepvoxels
  datadir: null                 # REQUIRED: set via --datadir CLI flag or override here; never hardcode in code
  half_res: true                # ASSUMED for fast default runs: paper's headline synthetic numbers use full 800x800;
                                 # half_res=true (400x400) is a common, paper-acknowledged faster setting (not the
                                 # Table 1 setting). Set false to match Table 1 exactly.
  testskip: 8                   # use every Nth test image during training-time validation renders (speed only)
  white_background: true        # synthetic Blender scenes are rendered on a white background (Sec 6.1)
  near: 2.0                     # scene-dependent near bound; ASSUMED default for Blender synthetic cube [-1,1]^3 scenes
  far: 6.0                      # scene-dependent far bound; ASSUMED default for Blender synthetic cube [-1,1]^3 scenes
  use_ndc: false                # true required for "Real Forward-Facing" LLFF scenes (Appendix C); false for synthetic

evaluation:
  metrics: ["psnr", "ssim", "lpips"]   # Table 1 metrics (Sec 6.1-6.3)
  chunk_size: 8192               # points-per-chunk for memory-bounded inference (not a paper hyperparameter; engineering only)
  render_test_every: 50000
  save_rendered_images: true

hardware:
  device: "gpu"                  # gpu | cpu
  mixed_precision: false         # not described in the paper; kept off by default for numerical fidelity
  num_workers: 4                 # tf.data parallel map/prefetch workers
  tiny_hardware_mode: false      # set true (or use --tiny) to apply utils/tiny_variant.py::TinyNeRFPreset overrides
